models:
  - name: int_booking_details # model name
    tests:                                        # ← model-level tests (not under columns:)
      - dbt_utils.unique_combination_of_columns:  # This is the test name, written as package_name.test_name
          arguments:
            combination_of_columns:
              - customer_id
              - property_id
              - property_booking_date

    columns:
      - name: revenue   # the specific column I want to test
        tests:
          - is_non_negative # custom generic test name and this is saved under "/macros/test_is_non_negative.sql"

      - name: discount
        tests:
          - is_non_negative  # I can use this generic test to any model, only .yml file to update like this one