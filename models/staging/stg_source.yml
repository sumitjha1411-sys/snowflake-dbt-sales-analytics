# Create a source and its tests, referencing the raw schema tables in the Snowflake data warehouse.
# Run the tests using: dbt test --select source:stg_source
# Total: 18 tests

sources:
  - name: stg_source
    database: dbt_tutorial
    schema: raw
    tables:

      - name: customer     # table name
        columns:
          - name: customer_id  
            tests:
              - unique
              - not_null

          - name: customer_segment
            tests:
              - accepted_values:
                  arguments:
                    values: ['Premium', 'Standard', 'Luxury', 'Budget']

      - name: bookings           # table name
        columns:
          - name: booking_order_id
            tests:
              - unique
              - not_null

          - name: customer_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('stg_source', 'customer')
                    field: customer_id

          - name: booking_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('stg_source', 'property_type')
                    field: booking_id

          - name: selling_price
            tests:
              - not_null

          - name: cancelled
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [0, 1]

      - name: property_type       # table name
        columns:
          - name: booking_id
            tests:
              - unique
              - not_null

          - name: product_price
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false

          - name: product_cost
            tests:
              - not_null
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    inclusive: false

