# Creating a source and tests, which will be a reference to the "raw" schema tables in the data warehouse (snowflake).
# to run this use command: dbt test --select source:stg_source (source_name), total 16 tests

sources:
  - name: stg_source
    database: dbt_tutorial
    schema: raw
    tables:

      - name: customer     # table name
        columns:
          - name: customer_id  
            tests:
              - unique
              - not_null

          - name: customer_segment
            tests:
              - accepted_values:
                  arguments:
                    values: ['Premium', 'Standard', 'Luxury', 'Budget']

      - name: bookings           # table name
        columns:
          - name: booking_order_id
            tests:
              - unique
              - not_null

          - name: customer_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('stg_source', 'customer')
                    field: customer_id

          - name: booking_id
            tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('stg_source', 'property_type')
                    field: booking_id

          - name: selling_price
            tests:
              - not_null

          - name: cancelled
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [0, 1]

      - name: property_type       # table name
        columns:
          - name: booking_id
            tests:
              - unique
              - not_null

          - name: product_price
            tests:
              - not_null

          - name: product_cost
            tests:
              - not_null

